<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TaskBridge UI</title>
    <style>
      body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; background:#f6f8fa; color:#111; display:flex; align-items:center; justify-content:center; height:100vh; margin:0 }
      .card { background:#fff; padding:2rem 2.5rem; border-radius:8px; box-shadow:0 6px 18px rgba(16,24,40,0.08); max-width:720px; text-align:center }
      h1 { margin:0 0 0.5rem 0 }
      p { margin:0.25rem 0 }
      a { color:#0366d6 }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>TaskBridge</h1>
      <p>Placeholder UI served from Express (public/index.html)</p>
      <p><strong>API status:</strong> <span id="status">checking…</span></p>
      <p><a href="/api/health">View API health JSON</a></p>
    </div>

    <script>
      fetch('/api/health')
        .then(r => r.json())
        .then(j => { document.getElementById('status').textContent = j.status || JSON.stringify(j) })
        .catch(() => { document.getElementById('status').textContent = 'unreachable' })
    </script>
  </body>
</html>
